architectury {
    common rootProject.enabled_platforms.split(',')
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"
}

tasks.register('farmingSettingsUiSelfTest', JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.goodbird.player2npc.companion.gui.settings.FarmingSettingsUiSelfTest'
    enableAssertions = true
}

tasks.register('companionIdentityReconciliationPolicySelfTest', JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.goodbird.player2npc.companion.CompanionIdentityReconciliationPolicySelfTest'
    enableAssertions = true
}

tasks.register('companionLifecycleReceiptPolicySelfTest', JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.goodbird.player2npc.companion.CompanionLifecycleReceiptPolicySelfTest'
    enableAssertions = true
}

tasks.register('offlineDeathTombstoneStorageSelfTest', JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.goodbird.player2npc.companion.OfflineDeathTombstoneStorageSelfTest'
    enableAssertions = true
}

tasks.register('permadeathBanStorageSelfTest', JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.goodbird.player2npc.companion.PermadeathBanStorageSelfTest'
    enableAssertions = true
}

tasks.register('persistentDataManagerStateValidationSelfTest', JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.goodbird.player2npc.companion.PersistentDataManagerStateValidationSelfTest'
    enableAssertions = true
}

tasks.named('check') {
    dependsOn tasks.named('farmingSettingsUiSelfTest')
    dependsOn tasks.named('companionIdentityReconciliationPolicySelfTest')
    dependsOn tasks.named('companionLifecycleReceiptPolicySelfTest')
    dependsOn tasks.named('offlineDeathTombstoneStorageSelfTest')
    dependsOn tasks.named('permadeathBanStorageSelfTest')
    dependsOn tasks.named('persistentDataManagerStateValidationSelfTest')
}
